<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UKonek - Queue Display</title>
    <link rel="icon" href="../favicon.ico">
    <link rel="stylesheet" href="../css/tv-view.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body class="tv-mode">
    <!-- Header -->
    <header class="tv-header">
        <div class="tv-logo-area">
            <img src="../U-KonekLogo-transparent.png" alt="UKonek Logo" class="tv-logo">
            <span class="tv-brand">AFM Roquero Medical Clinic</span>
        </div>
        <div id="tv-clock" class="tv-clock">00:00</div>
    </header>

    <!-- Main Content -->
    <div class="tv-container">
        <!-- Now Serving - Main Display -->
        <section class="tv-serving-section">
            <div class="tv-label">NOW SERVING</div>
            <div id="serving-number" class="serving-number">---</div>
            <div id="serving-status" class="serving-status">Waiting for patients...</div>
        </section>

        <!-- Queue Lists -->
        <div class="tv-queue-grid">
            <!-- On Call -->
            <section class="tv-queue-section oncall-section">
                <div class="queue-section-header">
                    <div class="queue-icon">📢</div>
                    <h2>On Call</h2>
                </div>
                <div id="oncall-list" class="queue-list">
                    <div class="queue-empty">—</div>
                </div>
            </section>

            <!-- Waiting -->
            <section class="tv-queue-section waiting-section">
                <div class="queue-section-header">
                    <div class="queue-icon">⏳</div>
                    <h2>Waiting</h2>
                </div>
                <div id="waiting-list" class="queue-list">
                    <div class="queue-empty">No waiting tickets</div>
                </div>
            </section>
        </div>
    </div>

    <!-- Hidden audio for notification -->
    <audio id="call-sound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

    <!-- Scripts -->
    <script src="../js/runtime-config.js"></script>
    <script type="module" src="../js/tv-view.js?v=20260504"></script>
</body>
</html>
