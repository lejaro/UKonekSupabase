<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UKonek - TV View Mode</title>
    <link rel="icon" href="../favicon.ico">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/tv-view.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="tv-mode">
    <div id="tv-container" class="tv-container">
        <!-- Sidebar for Upcoming -->
        <aside class="tv-upcoming">
            <div class="tv-header">
                <h2>Upcoming</h2>
            </div>
            <div id="upcoming-list" class="upcoming-list">
                <!-- Upcoming numbers here -->
                <div class="upcoming-placeholder">No upcoming tickets</div>
            </div>
        </aside>

        <!-- Main Display for Serving -->
        <main class="tv-main">
            <div class="tv-serving-panel">
                <div class="tv-status-badge">Now Serving</div>
                <div id="serving-number" class="serving-number">---</div>
                <div id="serving-label" class="serving-label">Waiting for patients...</div>
            </div>
            
            <footer class="tv-footer">
                <div class="tv-logo-area">
                    <img src="../U-KonekLogo-transparent.png" alt="UKonek Logo" class="tv-logo">
                    <span class="tv-brand">UKonek Dashboard</span>
                </div>
                <div id="tv-clock" class="tv-clock">00:00:00</div>
            </footer>
        </main>
    </div>

    <!-- Hidden audio for notification -->
    <audio id="call-sound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

    <!-- Scripts -->
    <script type="module" src="../js/tv-view.js"></script>
</body>
</html>
